<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – CI/CD Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#042C53 0%,#185FA5 100%);
         min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{width:400px;border-radius:14px;border:none;
          box-shadow:0 12px 40px rgba(0,0,0,.3);}
    .logo{font-size:2.2rem;color:#185FA5;}
  </style>
</head>
<body>
<div class="card p-4">
  <div class="text-center mb-4">
    <i class="bi bi-cloud-upload-fill logo"></i>
    <h4 class="fw-bold mt-2" style="color:#042C53">CI/CD Platform</h4>
    <p class="text-muted small mb-0">Plateforme de déploiement multi-cloud</p>
  </div>
  {% if messages %}{% for m in messages %}
  <div class="alert alert-danger py-2 small mb-3">{{ m }}</div>
  {% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold small">Nom d'utilisateur</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold small">Mot de passe</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" required>
      </div>
    </div>
    <button type="submit" class="btn w-100 fw-semibold"
      style="background:#185FA5;color:#fff;padding:.6rem">
      <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
    </button>
  </form>
</div>
</body>
</html>
